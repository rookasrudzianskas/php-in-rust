[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "PHP-3.01"
repository = "https://github.com/rookasrudzianskas/php-in-rust"
rust-version = "1.88"

[workspace.dependencies]
php-syntax = { path = "crates/php-syntax" }
php-runtime = { path = "crates/php-runtime" }
php-ext = { path = "crates/php-ext" }
php-regex = { path = "crates/php-regex" }
php-timelib = { path = "crates/php-timelib" }
php-hash = { path = "crates/php-hash" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = false
codegen-units = 16
